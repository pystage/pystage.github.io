name: Publish pages

# Rebuilds the pages branch (main at the root, review/<name> branches under
# review/<name>/) with tools/publish-pages.sh.
#
# A push to a review branch runs the workflow file of that branch, so review
# branches must be created from a main that already has this file. Otherwise
# the maintainer starts the workflow by hand (Actions > Publish pages > Run
# workflow).
on:
  push:
    branches:
      - main
      - 'review/**'
  delete:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    # a deleted branch triggers this too; other deleted refs (tags) are not reviews
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # Hugo extended, pinned; only needed when main or a review is a Hugo site.
      # To update: change the version and the checksum from the release's
      # hugo_<version>_checksums.txt.
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.157.0
          HUGO_SHA256: 5b2fdfe4646a48ee98107035024fd6640299bff31c4486c259eeeb9f4c822492
        run: |
          file="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${file}"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tools/publish-pages.sh --push
